    <script>
      // Global bulletproof fetch & JSON error guard
      const _origFetch = window.fetch;
      window.fetch = async function(...args) {
        const res = await _origFetch.apply(this, args);
        const _origJson = res.json;
        res.json = async function() {
          const clone = res.clone();
          try {
            return await _origJson.call(res);
          } catch (err) {
            console.warn('[JSON Guard] Caught non-JSON response for:', args[0], err.message);
            try {
              const text = await clone.text();
              // Try to see if it contains valid JSON anyway
              const match = text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
              if (match) {
                return JSON.parse(match[0]);
              }
            } catch (_) {}
            return {};
          }
        };
        return res;
      };
    </script>

    <script>
      const killClutter = () => {
        document.querySelectorAll(
          '#cyber-controls-badge, #shuttle-board-prompt, .ccb-inner, .phone-toast, .phone-chip, ' +
          '.walk-prompt, .walk-prompt-frame, .walk-prompt-inner, .walk-controls, .drive-tutorial, .enter-car, ' +

        ).forEach(el => el.remove());
      };
      killClutter();
      window.addEventListener('DOMContentLoaded', killClutter);
      const _clutterObs = new MutationObserver(() => killClutter());
      if (document.body) {
        _clutterObs.observe(document.body, { childList: true, subtree: true });
      } else {
        window.addEventListener('DOMContentLoaded', () => {
          if (document.body) _clutterObs.observe(document.body, { childList: true, subtree: true });
        });
