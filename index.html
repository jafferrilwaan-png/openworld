    <script>
      // Global bulletproof fetch & JSON error guard
      const _origFetch = window.fetch;
      window.fetch = async function(...args) {
        const res = await _origFetch.apply(this, args);
        const _origJson = res.json;
        res.json = async function() {
          const clone = res.clone();
          try {
            return await _origJson.call(res);
          } catch (err) {
            console.warn('[JSON Guard] Caught non-JSON response for:', args[0], err.message);
            try {
              const text = await clone.text();
              // Try to see if it contains valid JSON anyway
              const match = text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
              if (match) {
                return JSON.parse(match[0]);
              }
            } catch (_) {}
            return {};
          }
        };
        return res;
      };
    </script>

    <script>
      const killBadges = () => {
        document.querySelectorAll('#cyber-controls-badge, #shuttle-board-prompt, .ccb-inner, .phone-toast, .phone-chip, .walk-prompt, .walk-prompt-frame, .walk-prompt-inner, .walk-controls, .drive-tutorial, .enter-car').forEach(el => el.remove());
      };
      killBadges();
      window.addEventListener('DOMContentLoaded', killBadges);

      // Auto-lock pointer on canvas click without showing any prompt
      window.addEventListener('click', (e) => {
        if (!document.pointerLockElement && e.target && e.target.tagName === 'CANVAS') {
          try { e.target.requestPointerLock(); } catch (_) {}
        }
      });
