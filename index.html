    <script type="module" crossorigin src="/assets/index-DhZ0DJgE.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D2kW7q3e.css">
    <style>
      #cyber-controls-badge, #shuttle-board-prompt, .ccb-inner, .phone-toast, .phone-chip,
      .walk-prompt, .walk-prompt-frame, .walk-prompt-inner, .walk-prompt-pulse,
      .walk-controls, .drive-tutorial, .walk-prompt--visible, .walk-controls__backdrop, .walk-controls__dialog,
      .enter-car, .enter-car *, button.enter-car {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>
    <script>
      const killBadges = () => {
        document.querySelectorAll('#cyber-controls-badge, #shuttle-board-prompt, .ccb-inner, .phone-toast, .phone-chip, .walk-prompt, .walk-prompt-frame, .walk-prompt-inner, .walk-controls, .drive-tutorial, .enter-car').forEach(el => el.remove());
      };
      killBadges();
      window.addEventListener('DOMContentLoaded', killBadges);

      // Auto-lock pointer on canvas click without showing any prompt
      window.addEventListener('click', (e) => {
        if (!document.pointerLockElement && e.target && e.target.tagName === 'CANVAS') {
          try { e.target.requestPointerLock(); } catch (_) {}
        }
      });
    </script>
